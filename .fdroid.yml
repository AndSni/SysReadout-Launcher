# Summary/Description are intentionally omitted: the fastlane-structured
# metadata/en-US/{title,short_description,full_description}.txt in this repo is
# the single source of truth.

# Each version tag also publishes a GitHub Release at that tag
# (.github/workflows/release-tag.yml) carrying the identical, developer-signed
# APK, so F-Droid's reproducible-build check can diff its own build against it.
Binaries: 
  https://github.com/AndSni/SysReadout-Launcher/releases/download/v%v/SysReadout-Launcher.apk

Builds:
  - versionName: 0.2.0
    versionCode: 2
    commit: 236c18797bb5919273da85979b2e1aafe17c1f0e
    # The Gradle root is the repo root; F-Droid looks for the output APK under
    # <subdir>/build/outputs/apk, so this must be the app module itself.
    subdir: app
    gradle:
      - yes

AllowedAPKSigningKeys: 03873cc1869db581465c718d15b58d7f80999dec058ff21617b58267760a91bb

AutoUpdateMode: Version
# Only vX.Y.Z tags are releases; `latest` is CI's rolling pre-release build.
UpdateCheckMode: Tags ^v[0-9.]+$
